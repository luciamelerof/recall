<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall - Retrieval practice</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="./js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Recall</h1>
    <nav>
      <button data-view="bank" class="active">Question bank</button>
      <button data-view="quiz">Quiz</button>
      <button data-view="review">Review</button>
    </nav>
  </header>

  <main>
    <section id="bank" class="view active">
      <h2>Question bank</h2>
    </section>

    <section id="quiz" class="view">
      <h2>Quiz</h2>
    </section>

    <section id="review" class="view">
      <h2>Teacher review</h2>
    </section>
  </main>
</body>
</html>
